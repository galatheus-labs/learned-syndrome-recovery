seed: 42
cube_size: 32
train:
  epochs: 60
  batch_size: 8
  lr: 2e-4
  num_layers: 6
  base_channels: 64
  parity_weight: 2.0
  seed_decoder: true
  refiner_steps: 0
  coarse_map: true
  dct_field: true
  dct_keep_freqs: 4
  nullspace_aug_prob: 0.5
  boltzmann_anneal: true
  boltzmann_J: 0.3
  boltzmann_sweeps: 5
  val_every: 200
diffusion:
  T: 1000
  schedule: cosine
data:
  path: data/lattices/train
  val_path: data/lattices/val
constraints:
  axis_parity: true
  diagonal_parity: false
  subcube_2x2x2: false
  plane_parity: true
  global_parity: true
logging:
  project: parity_diffusion
  run_name: experiment_lattice_boltz
  ckpt_every: 99999
