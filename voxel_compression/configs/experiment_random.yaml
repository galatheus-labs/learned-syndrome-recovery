seed: 42
cube_size: 32
train:
  epochs: 30
  batch_size: 8
  lr: 2e-4
  num_layers: 6
  base_channels: 64
  parity_weight: 2.0
  seed_decoder: true
  refiner_steps: 0
  val_every: 200
diffusion:
  T: 1000
  schedule: cosine
data:
  path: data/lattices/train
  val_path: data/lattices/val
constraints:
  axis_parity: false
  diagonal_parity: false
  subcube_2x2x2: false
  plane_parity: false
  global_parity: false
  random_rows: 2100
logging:
  project: parity_diffusion
  run_name: experiment_random
  ckpt_every: 99999
