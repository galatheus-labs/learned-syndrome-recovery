seed: 42
cube_size: 32
train:
  epochs: 500
  batch_size: 64
  lr: 2e-4
  num_layers: 6
  base_channels: 48
  parity_weight: 1.0
  val_every: 500
diffusion:
  T: 1000
  schedule: cosine
data:
  path: data/lattices/train
  val_path: data/lattices/val
constraints:
  axis_parity: true
  diagonal_parity: true
  subcube_2x2x2: false
  plane_parity: false
  global_parity: true
logging:
  project: parity_diffusion
  run_name: lattice32_v2
  ckpt_every: 1000
