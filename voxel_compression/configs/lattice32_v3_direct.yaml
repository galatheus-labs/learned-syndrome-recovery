seed: 42
cube_size: 32
train:
  epochs: 500
  batch_size: 32
  lr: 2.73e-5
  num_layers: 6
  base_channels: 64
  parity_weight: 1.6
  direct_decoder: true
  val_every: 500
diffusion:
  T: 1000
  schedule: cosine
data:
  path: data/lattices/train
  val_path: data/lattices/val
constraints:
  axis_parity: true
  diagonal_parity: false
  subcube_2x2x2: false
  plane_parity: true
  global_parity: true
logging:
  project: parity_diffusion
  run_name: lattice32_v3_direct
  ckpt_every: 1000
