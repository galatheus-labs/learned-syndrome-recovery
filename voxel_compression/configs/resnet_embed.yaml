seed: 42
cube_size: 32
train:
  epochs: 60
  batch_size: 16
  lr: 2e-4
  parity_weight: 2.0
  seed_decoder: true
  refiner_steps: 0
  coarse_map: true
  dct_field: true
  dct_keep_freqs: 4
  nullspace_aug_prob: 0.5
  embed_weight: 1.0
  resnet: true
  resnet_width: 128
  resnet_depth: 12
  val_every: 200
diffusion:
  T: 1000
  schedule: cosine
data:
  path: data/mixed/train
  val_path: data/mixed/val
constraints:
  axis_parity: true
  diagonal_parity: false
  subcube_2x2x2: false
  plane_parity: true
  global_parity: true
logging:
  project: parity_diffusion
  run_name: resnet_embed
  ckpt_every: 2000
